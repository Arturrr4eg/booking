packages:
  - 'apps/*'

# pnpm не запускает install-скрипты зависимостей без явного разрешения
# (защита от вредоносных пакетов). true — разрешить, false — осознанно пропустить.
allowBuilds:
  '@prisma/engines': true
  argon2: true
  esbuild: true
  prisma: true
  sharp: false
  unrs-resolver: false
